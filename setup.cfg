[metadata]
name = pageindex-enterprise-cleanroom
version = 0.1.0
description = Clean-room PageIndex enterprise control plane and retrieval service.
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE
license = MIT
author = PageIndex clean-room contributors
url = https://github.com/CodeWithJames-AI/PageIndex
project_urls =
    Source = https://github.com/CodeWithJames-AI/PageIndex

[options]
packages =
    pageindex
    pageindex_enterprise
include_package_data = True
python_requires = >=3.9
install_requires =
    litellm==1.83.7
    pymupdf==1.26.4
    PyPDF2==3.0.1
    python-dotenv==1.0.1
    pyyaml==6.0.2

[options.package_data]
pageindex =
    config.yaml

[options.entry_points]
console_scripts =
    pageindex-enterprise = pageindex_enterprise.__main__:main
